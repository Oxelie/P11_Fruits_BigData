<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img">
<title>Chaîne de traitement PySpark du Projet 11</title>
<desc>Cinq étapes : chargement des images en bytes bruts, transfer learning MobileNetV2 avec broadcast des poids, featurisation par pandas UDF, réduction de dimension par PCA distribuée, et sauvegarde des résultats en parquet.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="340" fill="#FFFFFF"/>

<g>
<rect x="40" y="100" width="190" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="135" y="118" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">1. Chargement</text>
<text x="135" y="136" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#085041">images en bytes bruts</text>
</g>
<g>
<rect x="245" y="100" width="190" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="118" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">2. Transfer learning</text>
<text x="340" y="136" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#3C3489">MobileNetV2 + broadcast</text>
</g>
<g>
<rect x="450" y="100" width="190" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="545" y="118" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">3. Featurisation</text>
<text x="545" y="136" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#3C3489">pandas UDF par lots</text>
</g>

<g>
<rect x="143" y="230" width="190" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="238" y="248" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">4. PCA distribuée</text>
<text x="238" y="266" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#3C3489">1280 → 53 dimensions</text>
</g>
<g>
<rect x="348" y="230" width="190" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="443" y="248" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">5. Sauvegarde</text>
<text x="443" y="266" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#085041">résultats en parquet</text>
</g>

<line x1="230" y1="128" x2="245" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="435" y1="128" x2="450" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M545 156 L545 193 L238 193 L238 230" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="333" y1="258" x2="348" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="315" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#5F5E5A">Chaque étape s'exécute en parallèle, partition par partition, sur les workers du cluster</text>
</svg>
