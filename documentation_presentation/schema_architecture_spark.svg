<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img">
<title>Architecture Spark : 4 acteurs, mode cluster vs mode local</title>
<desc>Driver program et Cluster manager regroupés sur le Master Node ; Worker node hébergeant plusieurs Executors ; un Executor exécutant 4 tasks en parallèle. En mode cluster, ces éléments sont répartis sur des machines distinctes ; en mode local, tout tourne dans une seule JVM sur une seule machine.</desc>

<rect x="0" y="0" width="1000" height="480" fill="#FFFFFF"/>

<!-- ===== Top brackets (staple shape, opening down, pointing at boxes below) ===== -->
<text x="293" y="15" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#5B8FBF">Mode cluster</text>
<path d="M 20,45 L 20,25 L 566,25 L 566,45" fill="none" stroke="#5B8FBF" stroke-width="1.5"/>

<text x="178" y="62" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B8FBF">Master Node</text>
<path d="M 20,100 L 20,72 L 335,72 L 335,100" fill="none" stroke="#5B8FBF" stroke-width="1.5"/>

<text x="485" y="62" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B8FBF">Cluster physique</text>
<path d="M 400,100 L 400,72 L 570,72 L 570,100" fill="none" stroke="#5B8FBF" stroke-width="1.5"/>

<!-- ===== Main boxes ===== -->
<!-- Driver program -->
<rect x="20" y="140" width="150" height="165" rx="6" fill="#FFFFFF" stroke="#CCA677" stroke-width="2.5"/>
<text x="95" y="168" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#222222">Driver program</text>
<text x="95" y="188" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" font-weight="700" fill="#5A5A5A">Pilote de l'exécution</text>
<text x="35" y="212" font-family="Calibri, Arial, sans-serif" font-size="10.5" fill="#222222">&gt;&gt; Construit le plan</text>
<text x="42" y="225" font-family="Calibri, Arial, sans-serif" font-size="10.5" fill="#222222">de calcul</text>
<text x="35" y="248" font-family="Calibri, Arial, sans-serif" font-size="10.5" fill="#222222">&gt;&gt; Produit le</text>
<text x="42" y="261" font-family="Calibri, Arial, sans-serif" font-size="10.5" fill="#222222">SparkContext</text>
<text x="95" y="322" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" font-weight="700" fill="#CCA677">CODE APPLICATIF</text>

<!-- connector driver-clustermanager -->
<rect x="169" y="216" width="17" height="8" fill="#3B4252"/>

<!-- Cluster manager -->
<rect x="185" y="140" width="150" height="165" rx="6" fill="#FFFFFF" stroke="#8B6F3E" stroke-width="2"/>
<text x="260" y="168" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#222222">Cluster manager</text>
<text x="260" y="188" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" font-weight="700" fill="#5A5A5A">Intermédiaire</text>
<text x="200" y="215" font-family="Calibri, Arial, sans-serif" font-size="10.5" fill="#222222">&gt;&gt; Négocie et alloue</text>
<text x="207" y="228" font-family="Calibri, Arial, sans-serif" font-size="10.5" fill="#222222">les ressources</text>

<!-- line clustermanager -> worker node 1 -->
<line x1="335" y1="222" x2="400" y2="182" stroke="#3B4252" stroke-width="1.5"/>

<!-- Worker node 1 : définition complète (le premier en partant du haut) -->
<rect x="400" y="110" width="170" height="145" rx="6" fill="#F5EDDE" stroke="#222222" stroke-width="1.5"/>
<text x="485" y="132" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="15" font-weight="700" fill="#222222">Worker node</text>
<text x="485" y="149" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A5A5A">Machine physique du cluster</text>
<text x="415" y="169" font-family="Calibri, Arial, sans-serif" font-size="9.5" fill="#222222">&gt;&gt; Ressources (CPU,</text>
<text x="422" y="182" font-family="Calibri, Arial, sans-serif" font-size="9.5" fill="#222222">mémoire) réparties sur</text>
<text x="422" y="195" font-family="Calibri, Arial, sans-serif" font-size="9.5" fill="#222222">plusieurs executors</text>
<text x="485" y="242" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#222222">8 CPU / 16 threads logiques</text>

<!-- Worker node 2, 3 : simplifiés, sans executor affiché (allège le schéma) -->
<rect x="400" y="265" width="170" height="42" rx="6" fill="#F5EDDE" stroke="#222222" stroke-width="1.5"/>
<text x="485" y="283" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#222222">Worker node</text>
<text x="485" y="299" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="9.5" font-style="italic" fill="#222222">8 CPU / 16 threads logiques</text>

<rect x="400" y="313" width="170" height="42" rx="6" fill="#F5EDDE" stroke="#222222" stroke-width="1.5"/>
<text x="485" y="331" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#222222">Worker node</text>
<text x="485" y="347" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="9.5" font-style="italic" fill="#222222">8 CPU / 16 threads logiques</text>

<!-- lines worker node 1 -> executors (les worker node 2 et 3 n'ont pas d'executor affiché) -->
<line x1="570" y1="150" x2="640" y2="150" stroke="#3B4252" stroke-width="1.5"/>
<line x1="570" y1="180" x2="640" y2="286" stroke="#3B4252" stroke-width="1.5"/>
<line x1="570" y1="205" x2="640" y2="334" stroke="#3B4252" stroke-width="1.5"/>
<line x1="570" y1="230" x2="640" y2="382" stroke="#3B4252" stroke-width="1.5"/>

<!-- Executor 1 : définition complète (le premier en partant du haut) -->
<rect x="640" y="110" width="160" height="145" rx="6" fill="none" stroke="#CCA677" stroke-width="2.5" stroke-dasharray="7,5"/>
<text x="720" y="132" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="15" font-weight="700" fill="#222222">Executor</text>
<text x="720" y="147" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A5A5A">Processus (JVM)</text>
<text x="655" y="166" font-family="Calibri, Arial, sans-serif" font-size="9" fill="#222222">&gt;&gt; Exécute les tâches</text>
<text x="662" y="178" font-family="Calibri, Arial, sans-serif" font-size="9" fill="#222222">en parallèle</text>
<text x="655" y="196" font-family="Calibri, Arial, sans-serif" font-size="9" fill="#222222">&gt;&gt; Conserve un cache</text>
<text x="662" y="208" font-family="Calibri, Arial, sans-serif" font-size="9" fill="#222222">partagé pour toutes</text>
<text x="662" y="220" font-family="Calibri, Arial, sans-serif" font-size="9" fill="#222222">les tasks</text>
<text x="720" y="242" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#222222">4 threads (cores)</text>

<!-- Executor 2, 3, 4 : simplifiés (répétition de définition retirée) -->
<rect x="640" y="265" width="160" height="42" rx="6" fill="none" stroke="#CCA677" stroke-width="2.5" stroke-dasharray="7,5"/>
<text x="720" y="283" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#222222">Executor</text>
<text x="720" y="299" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" font-style="italic" fill="#222222">4 threads (cores)</text>

<rect x="640" y="313" width="160" height="42" rx="6" fill="none" stroke="#CCA677" stroke-width="2.5" stroke-dasharray="7,5"/>
<text x="720" y="331" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#222222">Executor</text>
<text x="720" y="347" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" font-style="italic" fill="#222222">4 threads (cores)</text>

<rect x="640" y="361" width="160" height="42" rx="6" fill="none" stroke="#CCA677" stroke-width="2.5" stroke-dasharray="7,5"/>
<text x="720" y="379" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#222222">Executor</text>
<text x="720" y="395" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" font-style="italic" fill="#222222">4 threads (cores)</text>

<text x="720" y="422" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" font-weight="700" fill="#CCA677">CODE APPLICATIF</text>

<!-- lines executor 1 -> 4 tasks (les 4 tasks ne sont connectées qu'à cet executor) -->
<line x1="800" y1="130" x2="860" y2="117" stroke="#3B4252" stroke-width="1.5"/>
<line x1="800" y1="155" x2="860" y2="172" stroke="#3B4252" stroke-width="1.5"/>
<line x1="800" y1="190" x2="860" y2="227" stroke="#3B4252" stroke-width="1.5"/>
<line x1="800" y1="220" x2="860" y2="282" stroke="#3B4252" stroke-width="1.5"/>

<!-- Task boxes (4), toutes reliées au seul Executor 1 -->
<g>
<rect x="860" y="92" width="120" height="50" rx="8" fill="#57BB8A" stroke="#57BB8A"/>
<text x="920" y="110" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Task</text>
<text x="920" y="122" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="7.3" fill="#FFFFFF">Unité de travail</text>
<text x="920" y="132" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="7.3" fill="#FFFFFF">&gt;&gt; 1 opération sur 1 partition</text>
</g>
<g>
<rect x="860" y="147" width="120" height="50" rx="8" fill="#57BB8A" stroke="#57BB8A"/>
<text x="920" y="165" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Task</text>
<text x="920" y="181" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8.5" font-style="italic" fill="#FFFFFF">1 thread</text>
</g>
<g>
<rect x="860" y="202" width="120" height="50" rx="8" fill="#57BB8A" stroke="#57BB8A"/>
<text x="920" y="220" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Task</text>
<text x="920" y="236" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8.5" font-style="italic" fill="#FFFFFF">1 thread</text>
</g>
<g>
<rect x="860" y="257" width="120" height="50" rx="8" fill="#57BB8A" stroke="#57BB8A"/>
<text x="920" y="275" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Task</text>
<text x="920" y="291" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8.5" font-style="italic" fill="#FFFFFF">1 thread</text>
</g>

