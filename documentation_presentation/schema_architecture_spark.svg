<path d="M 20,365 L 20,385 L 335,385 L 335,365" fill="none" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="178" y="401" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A8A8A">Master Node</text>

<path d="M 400,365 L 400,385 L 570,385 L 570,365" fill="none" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="485" y="401" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A8A8A">Simulation de cluster</text>

<path d="M 20,412 L 20,432 L 566,432 L 566,412" fill="none" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="293" y="448" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#8A8A8A">Mode local (1 seule machine = 1 seule JVM)</text>

</svg>
