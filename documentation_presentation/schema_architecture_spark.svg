<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img">
<title>Architecture Spark : 4 acteurs, mode cluster vs mode local</title>
<desc>Driver program et Cluster manager regroupés sur le Master Node ; Worker node hébergeant plusieurs Executors ; chaque Executor exécutant plusieurs Tasks en parallèle. En mode cluster, ces éléments sont répartis sur des machines distinctes ; en mode local, tout tourne dans une seule JVM sur une seule machine.</desc>

<rect x="0" y="0" width="1000" height="600" fill="#FFFFFF"/>

<!-- ===== Bracket helper shapes (drawn manually) ===== -->
<!-- Mode cluster (big top bracket) -->
<path d="M 20,45 L 20,60 L 285,60 L 285,52 L 293,60 L 301,52 L 301,60 L 566,60 L 566,45" fill="none" stroke="#5B8FBF" stroke-width="1.5"/>
<text x="293" y="35" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#5B8FBF">Mode cluster</text>

<!-- Master Node (top, over Driver+Cluster manager) -->
<path d="M 20,100 L 20,115 L 173,115 L 173,107 L 178,115 L 183,107 L 183,115 L 335,115 L 335,100" fill="none" stroke="#5B8FBF" stroke-width="1.5"/>
<text x="178" y="90" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B8FBF">Master Node</text>

<!-- Cluster physique (top, over Worker node) -->
<path d="M 400,100 L 400,115 L 477,115 L 477,107 L 485,115 L 493,107 L 493,115 L 570,115 L 570,100" fill="none" stroke="#5B8FBF" stroke-width="1.5"/>
<text x="485" y="90" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B8FBF">Cluster physique</text>

<!-- ===== Main boxes ===== -->
<!-- Driver program -->
<rect x="20" y="140" width="150" height="165" rx="6" fill="#FFFFFF" stroke="#CCA677" stroke-width="2.5"/>
<text x="95" y="168" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#222222">Driver program</text>
<text x="95" y="188" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" font-weight="700" fill="#5A5A5A">Pilote de l'exécution</text>
<text x="35" y="210" font-family="Calibri, Arial, sans-serif" font-size="10.5" fill="#222222">&gt;&gt; Construit le plan</text>
<text x="42" y="223" font-family="Calibri, Arial, sans-serif" font-size="10.5" fill="#222222">de calcul</text>
<text x="35" y="243" font-family="Calibri, Arial, sans-serif" font-size="10.5" fill="#222222">&gt;&gt; Produit le</text>
<text x="42" y="256" font-family="Calibri, Arial, sans-serif" font-size="10.5" fill="#222222">SparkContext</text>
<text x="95" y="295" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" font-weight="700" fill="#CCA677">CODE APPLICATIF</text>

<!-- connector driver-clustermanager -->
<rect x="169" y="216" width="17" height="8" fill="#3B4252"/>

<!-- Cluster manager -->
<rect x="185" y="140" width="150" height="165" rx="6" fill="#FFFFFF" stroke="#8B6F3E" stroke-width="2"/>
<text x="260" y="168" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#222222">Cluster manager</text>
<text x="260" y="188" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" font-weight="700" fill="#5A5A5A">Intermédiaire</text>
<text x="200" y="212" font-family="Calibri, Arial, sans-serif" font-size="10.5" fill="#222222">&gt;&gt; Négocie et alloue</text>
<text x="207" y="225" font-family="Calibri, Arial, sans-serif" font-size="10.5" fill="#222222">les ressources</text>

<!-- line clustermanager -> worker node -->
<line x1="335" y1="222" x2="400" y2="222" stroke="#3B4252" stroke-width="1.5"/>

<!-- Worker node -->
<rect x="400" y="140" width="170" height="165" rx="6" fill="#F5EDDE" stroke="#222222" stroke-width="1.5"/>
<text x="485" y="168" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#222222">Worker node</text>
<text x="485" y="187" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A5A5A">Machine physique du cluster</text>
<text x="415" y="208" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#222222">&gt;&gt; Ressources (CPU,</text>
<text x="422" y="221" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#222222">mémoire) réparties sur</text>
<text x="422" y="234" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#222222">plusieurs executors</text>
<text x="485" y="290" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" font-style="italic" fill="#222222">8 CPU / 16 threads logiques</text>

<!-- lines worker node -> executors -->
<line x1="570" y1="185" x2="640" y2="155" stroke="#3B4252" stroke-width="1.5"/>
<line x1="570" y1="260" x2="640" y2="265" stroke="#3B4252" stroke-width="1.5"/>

<!-- Executor A -->
<rect x="640" y="110" width="160" height="90" rx="6" fill="none" stroke="#CCA677" stroke-width="2.5" stroke-dasharray="7,5"/>
<text x="720" y="135" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#222222">Executor</text>
<text x="720" y="150" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A5A5A">Processus (JVM)</text>
<text x="720" y="167" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8.7" fill="#222222">&gt;&gt; Exécute en parallèle, cache partagé</text>
<text x="720" y="192" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#222222">4 threads (cores)</text>

<!-- Executor B -->
<rect x="640" y="225" width="160" height="90" rx="6" fill="none" stroke="#CCA677" stroke-width="2.5" stroke-dasharray="7,5"/>
<text x="720" y="250" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#222222">Executor</text>
<text x="720" y="265" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A5A5A">Processus (JVM)</text>
<text x="720" y="282" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8.7" fill="#222222">&gt;&gt; Exécute en parallèle, cache partagé</text>
<text x="720" y="307" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#222222">4 threads (cores)</text>

<text x="720" y="335" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" font-weight="700" fill="#CCA677">CODE APPLICATIF</text>

<!-- lines executor A -> tasks -->
<line x1="800" y1="130" x2="860" y2="115" stroke="#3B4252" stroke-width="1.5"/>
<line x1="800" y1="170" x2="860" y2="175" stroke="#3B4252" stroke-width="1.5"/>
<!-- lines executor B -> tasks -->
<line x1="800" y1="245" x2="860" y2="235" stroke="#3B4252" stroke-width="1.5"/>
<line x1="800" y1="285" x2="860" y2="295" stroke="#3B4252" stroke-width="1.5"/>

<!-- Task boxes (4) -->
<g>
<rect x="860" y="90" width="120" height="50" rx="8" fill="#57BB8A" stroke="#57BB8A"/>
<text x="920" y="108" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Task</text>
<text x="920" y="121" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8" fill="#FFFFFF">1 opération / 1 partition</text>
<text x="920" y="133" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8.5" font-style="italic" fill="#FFFFFF">1 thread</text>
</g>
<g>
<rect x="860" y="150" width="120" height="50" rx="8" fill="#57BB8A" stroke="#57BB8A"/>
<text x="920" y="168" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Task</text>
<text x="920" y="181" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8" fill="#FFFFFF">1 opération / 1 partition</text>
<text x="920" y="193" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8.5" font-style="italic" fill="#FFFFFF">1 thread</text>
</g>
<g>
<rect x="860" y="215" width="120" height="50" rx="8" fill="#57BB8A" stroke="#57BB8A"/>
<text x="920" y="233" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Task</text>
<text x="920" y="246" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8" fill="#FFFFFF">1 opération / 1 partition</text>
<text x="920" y="258" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8.5" font-style="italic" fill="#FFFFFF">1 thread</text>
</g>
<g>
<rect x="860" y="275" width="120" height="50" rx="8" fill="#57BB8A" stroke="#57BB8A"/>
<text x="920" y="293" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Task</text>
<text x="920" y="306" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8" fill="#FFFFFF">1 opération / 1 partition</text>
<text x="920" y="318" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="8.5" font-style="italic" fill="#FFFFFF">1 thread</text>
</g>

<!-- ===== Bottom brackets : local mode ===== -->
<!-- Master Node (gray) -->
<path d="M 20,320 L 20,335 L 173,335 L 173,343 L 178,335 L 183,343 L 183,335 L 335,335 L 335,320" fill="none" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="178" y="358" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A8A8A">Master Node</text>

<!-- Simulation de cluster (gray) -->
<path d="M 400,320 L 400,335 L 477,335 L 477,343 L 485,335 L 493,343 L 493,335 L 570,335 L 570,320" fill="none" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="485" y="358" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A8A8A">Simulation de cluster</text>

<!-- Mode local (big bottom bracket) -->
<path d="M 20,390 L 20,405 L 285,405 L 285,397 L 293,405 L 301,397 L 301,405 L 566,405 L 566,390" fill="none" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="293" y="428" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#8A8A8A">Mode local (1 seule machine = 1 seule JVM)</text>

<text x="500" y="475" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#5A5A5A">En mode cluster, chaque acteur vit sur une machine distincte. En mode local, tout se simule dans une seule JVM.</text>

</svg>
